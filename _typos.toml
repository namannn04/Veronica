[files]
extend-exclude = [
  "packaging/flatpak/shared-modules",
  "resources/emoji-catalog.json",
  "*.lock",
  "package-lock.json",
  "*.svg",
  "*.gpg",
]

[default]
extend-ignore-re = ["nd-ubuntu-fixes1"]

[default.extend-words]
gir = "gir"
caf = "caf"
abd = "abd"

[default.extend-identifiers]
PNGs = "PNGs"
