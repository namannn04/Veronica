[package]
name = "veronica-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native control center for Ubuntu"

[[bin]]
name = "veronica"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
veronica-core = { workspace = true }
veronica-usage = { workspace = true }
veronica-system = { workspace = true }
veronica-media = { workspace = true }
veronica-audit = { workspace = true }
veronica-database = { workspace = true }
veronica-calendar = { workspace = true }
veronica-machines = { workspace = true }
zbus = { workspace = true }

tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
base64 = "0.22"
tempfile = "3"

[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18"
cairo-rs = "0.18"

[lints]
workspace = true
