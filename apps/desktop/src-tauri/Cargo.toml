[package]
name = "veronica-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native control center for Ubuntu"

[[bin]]
name = "veronica"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
veronica-core = { workspace = true }
veronica-system = { workspace = true }
veronica-database = { workspace = true }
veronica-machines = { workspace = true }
veronica-host = { path = "../../../crates/veronica-host" }
veronica-protocol = { workspace = true }
zbus = { workspace = true }

tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "tracing"] }
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }

[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18"
cairo-rs = "0.18"

[lints]
workspace = true
