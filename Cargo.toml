[workspace]
resolver = "2"
members = [
    "crates/veronica-core",
    "crates/veronica-usage",
    "crates/veronica-system",
    "crates/veronica-calendar",
    "crates/veronica-machines",
    "crates/veronica-audit",
    "crates/veronica-database",
    "crates/veronica-media",
    "crates/veronica-protocol",
    "crates/veronica-pack",
    "crates/veronica-host",
    "crates/veronica-sdk",
    "crates/veronica-cli",
    "apps/desktop/src-tauri",
    "extensions/attention/backend",
    "extensions/audit/backend",
    "extensions/calendar/backend",
    "extensions/clipboard/backend",
    "extensions/color/backend",
    "extensions/companion/backend",
    "extensions/database/backend",
    "extensions/emoji/backend",
    "extensions/fixture/backend",
    "extensions/focus-dim/backend",
    "extensions/herdr/backend",
    "extensions/keystroke-highlight/backend",
    "extensions/machines/backend",
    "extensions/maintenance/backend",
    "extensions/quinjet/backend",
    "extensions/workspace/backend",
    "extensions/media/backend",
    "extensions/shelf/backend",
    "extensions/system/backend",
    "extensions/usage/backend",
    "extensions/utility/backend",
]

[workspace.package]
version = "0.1.26"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
repository = "https://github.com/namannn04/veronica"
authors = ["Veronica contributors"]
publish = false

[workspace.dependencies]
veronica-core = { path = "crates/veronica-core" }
veronica-usage = { path = "crates/veronica-usage" }
veronica-system = { path = "crates/veronica-system" }
veronica-media = { path = "crates/veronica-media" }
veronica-machines = { path = "crates/veronica-machines" }
veronica-calendar = { path = "crates/veronica-calendar" }
veronica-audit = { path = "crates/veronica-audit" }
veronica-database = { path = "crates/veronica-database" }
veronica-protocol = { path = "crates/veronica-protocol" }
veronica-sdk = { path = "crates/veronica-sdk" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.32"
zbus = { version = "6.5", default-features = false, features = ["tokio", "proxy", "service", "object-manager"] }
clap = { version = "4.5", features = ["derive"] }
notify = "8.2"
futures-util = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
use_self = "deny"
or_fun_call = "deny"
redundant_clone = "deny"
needless_collect = "deny"
derive_partial_eq_without_eq = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
float_cmp = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
similar_names = "allow"
