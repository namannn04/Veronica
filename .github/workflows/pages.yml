name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - "scripts/build-pages.sh"
      - "scripts/build-apt-repo.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build the site and installer endpoint
        run: ./scripts/build-pages.sh target/pages

      - name: Fetch the latest release packages
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/release-packages
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.flatpak' --pattern '*.deb' \
            --dir target/release-packages || true
          flatpak_bundle="$(find target/release-packages -name '*.flatpak' | head -1)"
          deb_count="$(find target/release-packages -name '*.deb' | wc -l)"
          echo "flatpak=${flatpak_bundle}" >> "$GITHUB_OUTPUT"
          echo "debs=${deb_count}" >> "$GITHUB_OUTPUT"
          [ -n "$flatpak_bundle" ] || echo "::warning::The latest release has no Flatpak bundle; publishing the site without a Flatpak repository."
          [ "$deb_count" -gt 0 ] || echo "::warning::The latest release has no Debian package; publishing the site without an apt repository."

      - name: Import the package signing key
        id: signing
        if: steps.packages.outputs.flatpak != '' || steps.packages.outputs.debs != '0'
        env:
          PACKAGE_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          gnupg_home="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$gnupg_home"
          printf '%s' "$PACKAGE_GPG_PRIVATE_KEY" | gpg --homedir "$gnupg_home" --batch --import
          key_id="$(gpg --homedir "$gnupg_home" --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          public_id="$(gpg --show-keys --with-colons packaging/flatpak/veronica-repo.gpg | awk -F: '/^fpr/ { print $10; exit }')"
          test -n "$key_id"
          test "$key_id" = "$public_id"
          echo "GNUPGHOME=$gnupg_home" >> "$GITHUB_ENV"
          echo "key_id=$key_id" >> "$GITHUB_OUTPUT"

      - name: Publish the signed Flatpak repository
        if: steps.packages.outputs.flatpak != ''
        env:
          FLATPAK_BUNDLE: ${{ steps.packages.outputs.flatpak }}
          SIGNING_KEY_ID: ${{ steps.signing.outputs.key_id }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak ostree
          ./scripts/build-flatpak-repo.sh "$FLATPAK_BUNDLE" target/pages "$SIGNING_KEY_ID"

      - name: Publish the signed apt repository
        if: steps.packages.outputs.debs != '0'
        env:
          SIGNING_KEY_ID: ${{ steps.signing.outputs.key_id }}
        run: |
          sudo apt-get install --no-install-recommends -y apt-utils
          ./scripts/build-apt-repo.sh target/release-packages target/pages "$SIGNING_KEY_ID"

      - name: Verify the apt repository installs Veronica
        if: steps.packages.outputs.debs != '0'
        run: |
          sources="$RUNNER_TEMP/veronica.list"
          sudo install -D -m 0644 target/pages/apt/veronica.gpg /etc/apt/keyrings/veronica.gpg
          sudo rm -rf /srv/veronica-apt
          sudo cp -R target/pages/apt /srv/veronica-apt
          sudo chmod -R a+rX /srv/veronica-apt
          echo "deb [signed-by=/etc/apt/keyrings/veronica.gpg] file:/srv/veronica-apt stable main" > "$sources"
          apt_options=(-o Dir::Etc::sourcelist="$sources" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0)
          sudo apt-get update "${apt_options[@]}"
          (cd "$RUNNER_TEMP" && apt-get download "${apt_options[@]}" veronica)

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: target/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
