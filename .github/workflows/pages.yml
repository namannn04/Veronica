name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - "scripts/build-pages.sh"
      - "scripts/build-apt-repo.sh"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  catalog:
    name: Sign the extension catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: extension-catalog
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - name: Look for the signing key
        id: secret
        env:
          SIGNING_KEY: ${{ secrets.EXTENSIONS_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::notice::EXTENSIONS_SIGNING_KEY is not set in the extension-catalog environment, so the site ships without an extension catalog."
          else
            echo "present=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.secret.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the packaging tool
        if: steps.secret.outputs.present == 'true'
        run: cargo build --release --locked -p veronica-pack

      - name: Require a key the host trusts
        id: trusted
        if: steps.secret.outputs.present == 'true'
        env:
          EXTENSIONS_SIGNING_KEY: ${{ secrets.EXTENSIONS_SIGNING_KEY }}
        run: |
          status="$(target/release/vr-pack --json key-status --key env:EXTENSIONS_SIGNING_KEY)"
          key_id="$(jq -r .keyId <<<"$status")"
          if [ "$(jq -r .trusted <<<"$status")" != true ]; then
            echo "::notice::The signing key $key_id is not a release key in crates/veronica-host/src/trust.rs, so the site ships without an extension catalog."
            exit 0
          fi
          {
            echo "ready=true"
            echo "key_id=$key_id"
            echo "public_key=$(jq -r --arg id "$key_id" '.compiled[] | select(.id == $id) | .public' <<<"$status")"
          } >>"$GITHUB_OUTPUT"

      - name: Collect every published extension release
        id: metadata
        if: steps.trusted.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata="$RUNNER_TEMP/extension-metadata"
          mkdir -p "$metadata"
          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
            --json tagName --jq '.[].tagName | select(startswith("ext/"))')
          for tag in "${tags[@]}"; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.zst.json' \
              --dir "$metadata/${tag//\//_}"
          done
          echo "dir=$metadata" >>"$GITHUB_OUTPUT"
          echo "count=${#tags[@]}" >>"$GITHUB_OUTPUT"
          [ "${#tags[@]}" -gt 0 ] || echo "::notice::No extension release is published yet, so the site ships without an extension catalog."

      - name: Build, sign and verify the catalog
        id: sign
        if: steps.trusted.outputs.ready == 'true' && steps.metadata.outputs.count != '0'
        env:
          EXTENSIONS_SIGNING_KEY: ${{ secrets.EXTENSIONS_SIGNING_KEY }}
          KEY_ID: ${{ steps.trusted.outputs.key_id }}
          METADATA: ${{ steps.metadata.outputs.dir }}
          TRUSTED_PUBLIC_KEY: ${{ steps.trusted.outputs.public_key }}
        run: |
          out="$RUNNER_TEMP/extension-catalog/extensions/v1"
          mkdir -p "$out"
          payload="$RUNNER_TEMP/catalog-payload.json"
          target/release/vr-pack catalog --metadata "$METADATA" --out "$payload" \
            --revision "$(date +%s)" --commit "$GITHUB_SHA"
          target/release/vr-pack sign --key env:EXTENSIONS_SIGNING_KEY --key-id "$KEY_ID" \
            --out "$out/catalog.signed.json" "$payload"
          target/release/vr-pack verify --public "$TRUSTED_PUBLIC_KEY" --key-id "$KEY_ID" \
            "$out/catalog.signed.json"
          echo "signed=true" >>"$GITHUB_OUTPUT"

      - name: Keep the signed catalog for the site
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: extension-catalog
          path: ${{ runner.temp }}/extension-catalog/
          if-no-files-found: error

  build:
    needs: catalog
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build the site and installer endpoint
        run: ./scripts/build-pages.sh target/pages

      - name: Add the signed extension catalog
        if: needs.catalog.outputs.signed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: extension-catalog
          path: target/pages

      - name: Fetch the newest app release packages
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/release-packages
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1000 --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))]
              | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // ""')"
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.flatpak' --pattern '*.deb' \
              --dir target/release-packages || true
          fi
          flatpak_bundle="$(find target/release-packages -name '*.flatpak' | head -1)"
          deb_count="$(find target/release-packages -name '*.deb' | wc -l)"
          echo "flatpak=${flatpak_bundle}" >> "$GITHUB_OUTPUT"
          echo "debs=${deb_count}" >> "$GITHUB_OUTPUT"
          [ -n "$flatpak_bundle" ] || echo "::warning::The latest release has no Flatpak bundle; publishing the site without a Flatpak repository."
          [ "$deb_count" -gt 0 ] || echo "::warning::The latest release has no Debian package; publishing the site without an apt repository."

      - name: Import the package signing key
        id: signing
        if: steps.packages.outputs.flatpak != '' || steps.packages.outputs.debs != '0'
        env:
          PACKAGE_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          gnupg_home="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$gnupg_home"
          printf '%s' "$PACKAGE_GPG_PRIVATE_KEY" | gpg --homedir "$gnupg_home" --batch --import
          key_id="$(gpg --homedir "$gnupg_home" --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          public_id="$(gpg --show-keys --with-colons packaging/flatpak/veronica-repo.gpg | awk -F: '/^fpr/ { print $10; exit }')"
          test -n "$key_id"
          test "$key_id" = "$public_id"
          echo "GNUPGHOME=$gnupg_home" >> "$GITHUB_ENV"
          echo "key_id=$key_id" >> "$GITHUB_OUTPUT"

      - name: Publish the signed Flatpak repository
        if: steps.packages.outputs.flatpak != ''
        env:
          FLATPAK_BUNDLE: ${{ steps.packages.outputs.flatpak }}
          SIGNING_KEY_ID: ${{ steps.signing.outputs.key_id }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak ostree
          ./scripts/build-flatpak-repo.sh "$FLATPAK_BUNDLE" target/pages "$SIGNING_KEY_ID"

      - name: Publish the signed apt repository
        if: steps.packages.outputs.debs != '0'
        env:
          SIGNING_KEY_ID: ${{ steps.signing.outputs.key_id }}
        run: |
          sudo apt-get install --no-install-recommends -y apt-utils
          ./scripts/build-apt-repo.sh target/release-packages target/pages "$SIGNING_KEY_ID"

      - name: Verify the apt repository installs Veronica
        if: steps.packages.outputs.debs != '0'
        run: |
          sources="$RUNNER_TEMP/veronica.list"
          sudo install -D -m 0644 target/pages/apt/veronica.gpg /etc/apt/keyrings/veronica.gpg
          sudo rm -rf /srv/veronica-apt
          sudo cp -R target/pages/apt /srv/veronica-apt
          sudo chmod -R a+rX /srv/veronica-apt
          echo "deb [signed-by=/etc/apt/keyrings/veronica.gpg] file:/srv/veronica-apt stable main" > "$sources"
          apt_options=(-o Dir::Etc::sourcelist="$sources" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0)
          sudo apt-get update "${apt_options[@]}"
          (cd "$RUNNER_TEMP" && apt-get download "${apt_options[@]}" veronica)

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: target/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
