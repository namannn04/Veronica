name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false

      - name: Verify the tag matches the application version
        run: |
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev \
            libfuse2t64 libgtk-3-dev libjavascriptcoregtk-4.1-dev libssl-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev patchelf pkg-config

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          no-cache: true

      - name: Install interface dependencies exactly
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build and smoke-test release artifacts
        run: ./scripts/release.sh

      - name: Install Flatpak tooling
        run: |
          sudo apt-get install --no-install-recommends -y dbus-daemon flatpak
          # Ubuntu 24.04 denies unprivileged user namespaces by default, and
          # flatpak-builder needs them for its bubblewrap sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Ubuntu's flatpak-builder is too old for Flathub's shared modules;
          # the Flathub build of it is what scripts/build-flatpak.sh falls back to.
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder

      - name: Build the Flatpak bundle
        run: |
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          # The Flathub builder installs the SDK and exports through the
          # session bus, which a CI runner does not start on its own.
          dbus-run-session -- ./scripts/build-flatpak.sh "target/release/bundle/deb/Veronica_${version}_amd64.deb"
          (cd target/flatpak && sha256sum "Veronica_${version}_x86_64.flatpak") >> target/release/bundle/SHA256SUMS

      - name: Build the snap
        run: |
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          sudo snap install snapcraft --classic
          sudo ./scripts/build-snap.sh "target/release/bundle/deb/Veronica_${version}_amd64.deb"
          (cd target/snap && sha256sum "Veronica_${version}_amd64.snap") >> target/release/bundle/SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          artifacts=(
            "target/release/bundle/deb/Veronica_${version}_amd64.deb"
            "target/release/bundle/appimage/Veronica_${version}_amd64.AppImage"
            "target/flatpak/Veronica_${version}_x86_64.flatpak"
            "target/snap/Veronica_${version}_amd64.snap"
            "target/release/bundle/SHA256SUMS"
          )
          # A maintainer can prepare a draft under their own account before
          # pushing the tag. Finish that draft without replacing its author.
          if gh release view "v${version}" --json isDraft > /tmp/veronica-release.json; then
            jq -e '.isDraft == true' /tmp/veronica-release.json
            gh release upload "v${version}" "${artifacts[@]}" --clobber
            gh release edit "v${version}" --draft=false --latest
          else
            gh release create "v${version}" "${artifacts[@]}" \
              --title "Veronica ${version}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Republish the Flatpak repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Publish the snap to the Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::notice::SNAPCRAFT_STORE_CREDENTIALS is not set, so the snap was attached to the release but not uploaded to the Snap Store"
            exit 0
          fi
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          snapcraft upload --release=stable "target/snap/Veronica_${version}_amd64.snap"

  launchpad-ppa:
    needs: package-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      LAUNCHPAD_PPA: ${{ vars.LAUNCHPAD_PPA || 'ppa:namannn04/veronica' }}
      PPA_MAINTAINER: ${{ vars.PPA_MAINTAINER || 'Naman Dadhich <namannn04@users.noreply.github.com>' }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y debhelper devscripts dput dpkg-dev

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          no-cache: true

      - name: Build the interface
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build the source packages
        run: |
          cargo install cargo-vendor-filterer --locked
          ./scripts/build-ppa-sources.sh "$RUNNER_TEMP/ppa"

      - name: Sign and upload to the PPA
        env:
          LAUNCHPAD_SIGNING_KEY: ${{ secrets.LAUNCHPAD_SIGNING_KEY }}
        run: |
          if [ -z "$LAUNCHPAD_SIGNING_KEY" ]; then
            echo "::notice::LAUNCHPAD_SIGNING_KEY is not set, so the PPA sources were built but not uploaded"
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s' "$LAUNCHPAD_SIGNING_KEY" | gpg --batch --import
          key_id="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          for changes in "$RUNNER_TEMP"/ppa/*_source.changes; do
            debsign --re-sign -k"$key_id" -p"gpg --batch --pinentry-mode loopback" "$changes"
            dput "$LAUNCHPAD_PPA" "$changes"
          done
