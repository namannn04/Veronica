name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # actions: write lets the run start the Pages workflow, which republishes the
  # Flatpak repository from the bundle this release attaches.
  actions: write
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Verify the tag matches the application version
        run: |
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev \
            libfuse2t64 libgtk-3-dev libjavascriptcoregtk-4.1-dev libssl-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev patchelf pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install interface dependencies exactly
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build and smoke-test release artifacts
        run: ./scripts/release.sh

      - name: Install Flatpak tooling
        run: |
          sudo apt-get install --no-install-recommends -y elfutils flatpak flatpak-builder
          # Ubuntu 24.04 denies unprivileged user namespaces by default, and
          # flatpak-builder needs them for its bubblewrap sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the Flatpak bundle
        run: |
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          ./scripts/build-flatpak.sh "target/release/bundle/deb/Veronica_${version}_amd64.deb"
          (cd target/flatpak && sha256sum "Veronica_${version}_x86_64.flatpak") >> target/release/bundle/SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          gh release create "v${version}" \
            "target/release/bundle/deb/Veronica_${version}_amd64.deb" \
            "target/release/bundle/appimage/Veronica_${version}_amd64.AppImage" \
            "target/flatpak/Veronica_${version}_x86_64.flatpak" \
            "target/release/bundle/SHA256SUMS" \
            --title "Veronica ${version}" \
            --generate-notes \
            --verify-tag

      - name: Republish the Flatpak repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

