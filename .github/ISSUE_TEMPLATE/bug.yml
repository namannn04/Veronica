name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected and observed behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Exact steps, and screenshots when the problem is visual.
    validations:
      required: true
  - type: input
    attributes:
      label: Veronica version
      placeholder: "0.1.26"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installed from
      options:
        - Install script or Debian package
        - apt repository
        - Snap
        - Launchpad PPA
        - Flatpak
        - AppImage
        - Built from source
    validations:
      required: true
  - type: input
    attributes:
      label: Ubuntu and GNOME Shell versions
      placeholder: Ubuntu 24.04, GNOME Shell 46
    validations:
      required: true
  - type: textarea
    attributes:
      label: vr diagnose
      description: Output of `vr diagnose`, with anything private removed.
      render: text
