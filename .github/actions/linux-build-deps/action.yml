name: Linux build dependencies
description: Install the system libraries Veronica's Tauri build links against
runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          build-essential curl file libayatana-appindicator3-dev \
          libgtk-3-dev libjavascriptcoregtk-4.1-dev libssl-dev \
          libsoup-3.0-dev libwebkit2gtk-4.1-dev libxdo-dev \
          librsvg2-dev patchelf pkg-config
