[package]
name = "veronica-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vr"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "gzip"] }
url = "2"
veronica-core = { workspace = true }
veronica-usage = { workspace = true }
veronica-system = { workspace = true }
veronica-media = { workspace = true }
veronica-audit = { workspace = true }
veronica-database = { workspace = true }
uuid = { version = "1", features = ["v4"] }
veronica-calendar = { workspace = true }
veronica-machines = { workspace = true }
zbus = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
