[package]
name = "veronica-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vr"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "gzip"] }
veronica-core = { workspace = true }
veronica-system = { workspace = true }
veronica-database = { workspace = true }
uuid = { version = "1", features = ["v4"] }
veronica-machines = { workspace = true }
veronica-host = { path = "../veronica-host" }
veronica-protocol = { workspace = true }
veronica-sdk = { workspace = true }
zbus = { workspace = true }
clap = { workspace = true, features = ["string"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
notify = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
veronica-usage = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
tempfile = "3"
veronica-pack = { path = "../veronica-pack" }

[lints]
workspace = true
